# Пример конфигурации resetwatch. Скопировать в configs/config.toml
# и поправить пути под машину.
#
# Секреты в конфиге не живут: бот Telegram берёт токен и chat id из
# окружения (файл окружения для systemd в deploy/resetwatch.env.example):
#   RESETWATCH_BOT_TOKEN     токен бота
#   RESETWATCH_BOT_CHAT_IDS  chat id получателей через запятую

[state]
# SQLite-файл состояния: дедуп событий, ключи адаптеров, свежесть.
path = "/var/lib/resetwatch/state.db"

[notify]
# На сегодня доступен один канал уведомлений.
kind = "telegram"

# Каждый источник это скрипт в adapters/ и своё расписание.
# schedule по умолчанию "*/15 * * * *" (раз в 15 минут),
# freshness_days по умолчанию 3. service это продукт источника, из него
# собирается заголовок уведомления (Claude, Codex); пусто = имя источника.

[[source]]
script = "adapters/clauderesets.js"
service = "Claude"
schedule = "*/15 * * * *"
freshness_days = 3
enabled = true

[[source]]
script = "adapters/modelyard.js"
service = "Codex"
schedule = "10/15 * * * *"
freshness_days = 3
enabled = true

[[source]]
script = "adapters/codexresetdev.js"
service = "Codex"
schedule = "5/15 * * * *"
freshness_days = 5
enabled = true

[[source]]
script = "adapters/codexresetorg.js"
service = "Codex"
schedule = "3/15 * * * *"
freshness_days = 5
enabled = true
